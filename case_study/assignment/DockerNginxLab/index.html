<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Nginx Lab - Practical 5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1117, #1a2332);
            color: #e6edf3;
        }
        .card {
            text-align: center;
            padding: 50px 40px;
            border: 1px solid #30363d;
            border-radius: 16px;
            background: rgba(22, 27, 34, 0.85);
            max-width: 550px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 { color: #58a6ff; font-size: 2rem; margin-bottom: 12px; }
        p  { color: #8b949e; margin: 8px 0; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: #238636;
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 20px;
        }
        .info { background: #1c2128; border-radius: 8px; padding: 16px; margin-top: 20px; font-size: 0.9rem; }
        .info span { color: #58a6ff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐳 Docker Nginx Web Server</h1>
        <p>This page is served by <strong>Nginx</strong> running inside a Docker container.</p>
        <p><em>Practical 5: Host a Website using Docker</em></p>
        <div class="info">
            <p><span>Command used:</span><br>
            <code>docker run -d -p 8080:80 --name my-nginx nginx</code></p>
        </div>
        <span class="badge">✅ Container is Running</span>
    </div>
</body>
</html>
